<!DOCTYPE html>
<html lang="id">
<head>
  <script src="https://pl30627583.profitableratecpmnetwork.com/d5/60/79/d56079c7788bd3e1f5be8a617ee76745.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Short asia collection</title>
    <!-- Google Font & FontAwesome Icon -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #0b0c10;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Ambient Glow Background Effect */
        .glow-bg {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255, 0, 85, 0.25) 0%, rgba(0,0,0,0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            filter: blur(50px);
            pointer-events: none;
        }

        /* Container Video Cinematik */
        .player-card {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 850px;
            background: rgba(20, 22, 28, 0.7);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* Ratio 16:9 */
            border-radius: 12px;
            overflow: hidden;
            background-color: #000000;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.8);
        }

        /* Banner Thumbnail / Poster Dummy */
        .video-poster {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.75;
            transition: transform 0.5s ease, opacity 0.5s ease;
        }

        .video-wrapper:hover .video-poster {
            transform: scale(1.03);
            opacity: 0.85;
        }

        /* Overlay Gradasi Cinematik */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(0deg, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.4) 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            cursor: pointer;
        }

        /* Custom Animated Play Button */
        .play-btn-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .play-btn {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #ff0055, #ff5000);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 28px;
            padding-left: 5px; /* Alignment icon play */
            box-shadow: 0 0 25px rgba(255, 0, 85, 0.6);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 2;
        }

        /* Effek Pulsa Cinematik */
        .play-btn-wrapper::before,
        .play-btn-wrapper::after {
            content: '';
            position: absolute;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(255, 0, 85, 0.4);
            z-index: 1;
            animation: pulse 2s infinite;
        }

        .play-btn-wrapper::after {
            animation-delay: 0.6s;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 0.8;
            }
            100% {
                transform: scale(1.8);
                opacity: 0;
            }
        }

        .overlay:hover .play-btn {
            transform: scale(1.15);
            box-shadow: 0 0 35px rgba(255, 0, 85, 0.9);
        }

        /* Video Info Header */
        .video-header {
            position: absolute;
            top: 15px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 3;
            pointer-events: none;
        }

        .badge-live {
            background: #ff0055;
            color: #fff;
            font-size: 11px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.5);
        }

        /* Detail Informasi Judul */
        .video-details {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .video-title {
            font-size: 18px;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        .video-sub {
            font-size: 13px;
            color: #a0a5b5;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div class="glow-bg"></div>

    <div class="player-card">
        <div class="video-wrapper">
            <!-- Poster Thumbnail -->
            <img src="https://i.ibb.co/chst3bqM/59a84aaf078cf0f9c84b49dc18b4444b.jpg" alt="Video Thumbnail" class="video-poster">

            <!-- Link Smartlink Adsterra -->
            <!-- GANTI URL HREF DI BAWAH INI DENGAN SMARTLINK ADSTERRA ANDA -->
            <a href="https://www.profitableratecpmnetwork.com/agijdjkf?key=b68403d796344c04660419b144a9cea4" 
               target="_blank" 
               class="overlay" 
               onclick="playVideoDirectly(event)">
                
                <div class="video-header">
                    <span class="badge-live"><i class="fa-solid fa-circle" style="font-size: 8px; vertical-align: middle; margin-right: 4px;"></i> HD 1080p</span>
                </div>

                <div class="play-btn-wrapper">
                    <div class="play-btn">
                        <i class="fa-solid fa-play"></i>
                    </div>
                </div>
            </a>
        </div>

        <div class="video-details">
            <div>
                <h2 class="video-title">Short asia collection</h2>
                <p class="video-sub">Klik tombol Play untuk memutar video secara langsung.</p>
            </div>
        </div>
    </div>

    <!-- Script Pengarah & Adsterra Redirect -->
    <script>
        function playVideoDirectly(event) {
            // Biarkan link target="_blank" membuka Smartlink Adsterra secara natural di tab baru
            // Lalu arahkan halaman ini ke file video MP4 setelah jeda sangat singkat
            setTimeout(function() {
                window.location.href = "https://trbnvideo.live/v/q1jQzQrs";
            }, 300);
        }
    </script>
</body>
</html>
