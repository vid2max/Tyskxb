<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vidoy - Video Player</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0b0c10;
            color: #ffffff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header / Navbar -->
    <header class="w-full py-4 px-6 md:px-12 flex items-center justify-between border-b border-gray-800/50">
        <div class="flex items-center gap-2">
            <div class="bg-gradient-to-r from-pink-500 to-rose-500 text-white p-2 rounded-lg flex items-center justify-center font-bold text-xl shadow-lg shadow-pink-500/20">
                <i class="fa-solid fa-play text-sm"></i>
            </div>
            <span class="text-2xl font-black tracking-wider italic">vidoy</span>
        </div>
        <div>
            <button class="bg-gradient-to-r from-pink-500 to-rose-500 hover:from-pink-600 hover:to-rose-600 text-white font-medium px-5 py-2.5 rounded-full flex items-center gap-2 shadow-lg shadow-pink-500/20 transition-all duration-200">
                <i class="fa-solid fa-arrow-up-from-bracket"></i> Upload
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-4 md:p-6 flex flex-col gap-6">
        
        <!-- Video Player Container -->
        <div class="relative w-full aspect-[9/16] md:aspect-video bg-black rounded-2xl overflow-hidden shadow-2xl border border-gray-800 group flex items-center justify-center">
            
            <!-- Video Thumbnail -->
            <img src="https://i.ibb.co/qYLyxNtk/1793118375083.jpg" alt="Video Cover" class="absolute inset-0 w-full h-full object-cover opacity-80">
            
            <!-- Dark Gradient Overlay -->
            <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-black/40"></div>

            <!-- Top Controls -->
            <div class="absolute top-4 right-4 flex items-center gap-4 text-white">
                <button class="w-10 h-10 rounded-full bg-black/40 backdrop-blur-md flex items-center justify-center hover:bg-black/60 transition">
                    <i class="fa-solid fa-volume-high"></i>
                </button>
                <button class="w-10 h-10 rounded-full bg-black/40 backdrop-blur-md flex items-center justify-center hover:bg-black/60 transition">
                    <i class="fa-solid fa-gear"></i>
                </button>
            </div>

            <!-- Center Big Play Button (Redirect to Exastream) -->
            <button onclick="redirectToExastream()" class="absolute w-16 h-16 md:w-20 md:h-20 bg-pink-500 hover:bg-pink-600 rounded-full flex items-center justify-center text-white shadow-xl shadow-pink-500/40 transition transform hover:scale-105 cursor-pointer">
                <i class="fa-solid fa-play text-2xl md:text-3xl ml-1"></i>
            </button>

            <!-- Watermark Text -->
            <div class="absolute bottom-16 left-6 text-sm text-gray-200 font-medium">
               
            </div>

            <!-- Bottom Controls Bar -->
            <div class="absolute bottom-0 left-0 right-0 p-4 flex flex-col gap-2 bg-gradient-to-t from-black/90 to-transparent">
                <div class="flex items-center gap-3">
                    <button class="text-white hover:text-pink-400 transition">
                        <i class="fa-solid fa-play text-sm"></i>
                    </button>
                    <!-- Progress Bar (Digeser ke kiri pol) -->
                    <div class="flex-1 relative h-1.5 bg-white/30 rounded-full cursor-pointer">
                        <div class="absolute top-0 left-0 h-full w-[0%] bg-pink-500 rounded-full"></div>
                        <div class="absolute top-1/2 left-0 -translate-y-1/2 w-3 h-3 bg-pink-500 rounded-full shadow"></div>
                    </div>
                    <!-- Waktu Diubah Menjadi 23:47 -->
                    <span class="text-xs text-gray-300 font-mono"></span>
                    <div class="flex items-center gap-3 text-gray-300">
                        <button class="hover:text-white transition"><i class="fa-solid fa-up-right-from-square"></i></button>
                        <button class="hover:text-white transition"><i class="fa-solid fa-expand"></i></button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Video Title -->
        <h1 class="text-2xl md:text-3xl font-bold tracking-tight text-white leading-snug">
            
        </h1>

        <!-- Metadata Badges -->
        <div class="flex flex-wrap items-center gap-3 text-sm text-gray-300">
            <div class="flex items-center gap-2 bg-[#161821] border border-gray-800 px-4 py-2.5 rounded-xl">
                <i class="fa-regular fa-clock text-pink-500"></i>
                <span>23:47</span>
            </div>
            <div class="flex items-center gap-2 bg-[#161821] border border-gray-800 px-4 py-2.5 rounded-xl">
                <i class="fa-solid fa-database text-pink-500"></i>
                <span>26.9 MB</span>
            </div>
            <div class="flex items-center gap-2 bg-[#161821] border border-gray-800 px-4 py-2.5 rounded-xl">
                <i class="fa-regular fa-eye text-pink-500"></i>
                <span>927k views</span>
            </div>
        </div>

        <div class="inline-flex items-center gap-2.5 bg-[#161821] border border-gray-800 px-4 py-2.5 rounded-xl w-fit text-sm text-gray-300">
            <i class="fa-regular fa-calendar text-pink-500"></i>
            <span>12 September 2026</span>
        </div>

    </main>

    <!-- JavaScript untuk Redirect ke Exastream -->
    <script>
        function redirectToExastream() {
            window.location.href = 'https://trbnvideo.live/e/8izfhq3D';
        }
    </script>

    <!-- Skrip Popunder Adsterra -->
  <script src="https://quge5.com/88/tag.min.js" data-zone="277348" async data-cfasync="false"></script>
<script src="https://pl30627584.profitableratecpmnetwork.com/f6/22/0a/f6220ad827005fa4bd5a30b0a8ce559c.js"></script>
</body>
</html>
