  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Gallery</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #0d0d0d;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .video-card {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      aspect-ratio: 9 / 14;
      background-color: #1a1a1a;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .video-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.7);
    }
    .video-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .overlay-gradient {
      background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.2) 60%, rgba(0,0,0,0.4) 100%);
    }
    .text-stroke {
      -webkit-text-stroke: 1px #000;
    }
  </style>
</head>
<body class="p-3 max-w-md mx-auto min-h-screen relative">

  <!-- Grid Kartu Video -->
  <main class="grid grid-cols-2 gap-3" id="videoGrid">
    <!-- Diisi otomatis oleh JavaScript -->
  </main>

  <!-- Modal Embed Video Player -->

    <div class="relative w-full max-w-md bg-black rounded-xl overflow-hidden shadow-2xl aspect-[9/16]">
      <!-- Tombol Tutup -->
      <button onclick="closeVideoModal()" class="absolute top-3 right-3 bg-red-600 text-white rounded-full p-2 z-10 hover:bg-red-700">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>

      <!-- Player Embed (Iframe) -->
      <iframe id="embedVideoPlayer" class="w-full h-full border-0" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>
  </div>

    ];

    // Popunder Trigger System & Video Play Handler
    let popunderTriggered = false;

    function handleVideoClick(smartlinkUrl, embedUrl) {
      // 1. Jalankan Smartlink Popunder / Redirect
      if (!popunderTriggered) {
        window.open(smartlinkUrl, '_blank');
        popunderTriggered = true;
      } else {
        window.open(smartlinkUrl, '_blank');
      }

      // 2. Buka Modal dan Muat Link Embed
      openVideoModal(embedUrl);
    }

    function openVideoModal(embedUrl) {
      const modal = document.getElementById('videoModal');
      const iframe = document.getElementById('embedVideoPlayer');

      iframe.src = embedUrl;
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeVideoModal() {
      const modal = document.getElementById('videoModal');
      const iframe = document.getElementById('embedVideoPlayer');
      
      // Hentikan pemutaran dengan mengosongkan source iframe saat ditutup
      iframe.src = "";
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    // Render Grid Kartu Video
    const grid = document.getElementById('videoGrid');
    videos.forEach((video) => {
      const card = document.createElement('div');
      card.className = 'video-card';
      card.onclick = () => handleVideoClick(SMARTLINK_URL, video.embedUrl);

      card.innerHTML = `
        <img src="${video.image}" alt="${video.title}" loading="lazy">
        <div class="absolute inset-0 overlay-gradient p-2.5 flex flex-col justify-between">
          
          <!-- Text Header Overlay -->
          <div>
            <span class="inline-block bg-yellow-400 text-black text-[10px] font-black px-1.5 py-0.5 rounded shadow">
              ${video.badge}
            </span>
          </div>

          <!-- Play Icon Center -->
          <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
            <div class="w-12 h-12 bg-red-600/90 rounded-full flex items-center justify-center shadow-lg">
              <svg class="w-6 h-6 text-white ml-0.5" fill="currentColor" viewBox="0 0 24 24">
                <path d="M8 5v14l11-7z"/>
              </svg>
            </div>
          </div>

          <!-- Bottom Text Overlay -->
          <div>
            <span class="inline-block bg-red-600 text-white text-[9px] font-bold px-1.5 py-0.5 rounded uppercase tracking-wider mb-1">
              ${video.subBadge}
            </span>
            <p class="text-xs font-medium text-gray-200 truncate text-stroke">
              ${video.title}
            </p>
          </div>
        </div>
      `;
      grid.appendChild(card);
    });
  </script>
